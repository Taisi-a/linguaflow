name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linguaflow
          POSTGRES_PASSWORD: linguaflow
          POSTGRES_DB: linguaflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linguaflow"
          --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://linguaflow:linguaflow@localhost:5432/linguaflow
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest -q
