services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linguaflow
      POSTGRES_PASSWORD: linguaflow
      POSTGRES_DB: linguaflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguaflow"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://linguaflow:linguaflow@db:5432/linguaflow
      # Ollama запущена на самом Маке, а не в контейнере
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
